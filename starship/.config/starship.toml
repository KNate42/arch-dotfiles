# starship prompt config
# This work made by Anfinogentov Nikita

"$schema" = "https://starship.rs/config-schema.json"

# Здесь я рисую приглашение отдельными неоновыми сегментами со скошенными краями, как панели HUD: каждая появляется, только когда ей есть что показать
add_newline = true
format = """
$os$directory$git_branch$git_status$python$nodejs$rust$java$docker_context$fill$cmd_duration$time
$character"""

[os]
disabled = false
format = "[](fg:blue)[$symbol ](fg:black bg:blue)"

[os.symbols]
Arch = "󰣇"

[directory]
format = "[$path ](fg:black bg:blue)[](fg:blue) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[directory.substitutions]
"~" = "󰋜"

[git_branch]
symbol = ""
format = "[](fg:purple)[ $symbol $branch ](fg:black bg:purple)[](fg:purple) "

[git_status]
format = "([](fg:red)[ $all_status$ahead_behind ](fg:black bg:red)[](fg:red) )"

[python]
symbol = ""
format = "[](fg:cyan)[ $symbol $version ](fg:black bg:cyan)[](fg:cyan) "

[nodejs]
symbol = ""
format = "[](fg:cyan)[ $symbol $version ](fg:black bg:cyan)[](fg:cyan) "

[rust]
symbol = ""
format = "[](fg:cyan)[ $symbol $version ](fg:black bg:cyan)[](fg:cyan) "

[java]
symbol = ""
format = "[](fg:cyan)[ $symbol $version ](fg:black bg:cyan)[](fg:cyan) "

[docker_context]
symbol = ""
format = "[](fg:cyan)[ $symbol $context ](fg:black bg:cyan)[](fg:cyan) "

[fill]
symbol = " "

[cmd_duration]
min_time = 2000
format = "[󱎫 $duration ](fg:yellow)"

[time]
disabled = false
time_format = "%H:%M"
format = "[󰥔 $time](fg:bright-black)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
