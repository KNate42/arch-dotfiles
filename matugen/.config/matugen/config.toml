# matugen: one wallpaper -> one palette for every program
# This work made by Anfinogentov Nikita

[config]
# Здесь я задаю выбор цвета без вопросов: без терминала matugen иначе падает
prefer = "saturation"
fallback_color = "#8ab4f8"
version_check = false
caching = false

[templates.kitty]
input_path = "./templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors.conf"

[templates.rofi]
input_path = "./templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors.rasi"

[templates.quickshell]
input_path = "./templates/quickshell-colors.json"
output_path = "~/.cache/matugen/colors.json"

[templates.gtk3]
input_path = "./templates/gtk.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "./templates/gtk.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.qt6ct]
input_path = "./templates/qtct-colors.conf"
output_path = "~/.config/qt6ct/colors/matugen.conf"

[templates.qt5ct]
input_path = "./templates/qtct-colors.conf"
output_path = "~/.config/qt5ct/colors/matugen.conf"

[templates.hyprlock]
input_path = "./templates/hyprlock-colors.conf"
output_path = "~/.config/hypr/hyprlock-colors.conf"

[templates.hyprland]
input_path = "./templates/hyprland-colors.lua"
output_path = "~/.config/hypr/modules/colors.lua"

[templates.fish]
input_path = "./templates/fish-colors.fish"
output_path = "~/.cache/matugen/fish-colors.fish"

[templates.nvim]
input_path = "./templates/nvim-colors.lua"
output_path = "~/.cache/matugen/nvim-colors.lua"

# Хуков post_hook нет: программы перезагружает wallpaper-set, когда все новые файлы уже на месте.
# Цвета SDDM пишутся в кэш, в общий каталог экрана входа их копирует тоже wallpaper-set.
[templates.sddm]
input_path = "./templates/sddm-theme.conf"
output_path = "~/.cache/matugen/sddm-theme.conf"
