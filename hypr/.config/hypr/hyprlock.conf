# hyprlock: lock screen with the current wallpaper and matugen colors
# This work made by Anfinogentov Nikita

# Здесь я подключаю цвета и путь к обоям, которые пишет matugen ($primary, $surface, $wallpaper ...)
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    fail_timeout = 2000
}

# Здесь я размываю и слегка приглушаю обои, чтобы тонкие часы и стеклянная пилюля читались на любом фоне
background {
    monitor =
    path = $wallpaper
    color = $surface
    blur_passes = 3
    blur_size = 8
    brightness = 0.72
}

label {
    monitor =
    text = $TIME
    color = $on_surface
    font_size = 120
    font_family = Inter Light
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $on_surface_variant
    font_size = 20
    font_family = Inter
    position = 0, 75
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $on_surface_variant
    font_size = 14
    font_family = Inter
    position = 0, 0
    halign = center
    valign = center
}

# Поле пароля в виде стеклянной пилюли с мягким контуром и точками вместо символов
input-field {
    monitor =
    size = 300, 52
    outline_thickness = 1
    rounding = 26
    outer_color = $glass_border
    inner_color = $glass_surface
    font_color = $on_surface
    check_color = $primary
    fail_color = $error
    fail_text = Ooops.. $FAIL
    placeholder_text = Password
    font_family = Inter
    hide_input = false
    dots_size = 0.25
    dots_spacing = 0.20
    dots_center = true
    fade_on_empty = false
    position = 0, -55
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[EN,RU]
    color = $on_surface_variant
    font_size = 12
    font_family = Inter
    position = 0, -110
    halign = center
    valign = center
}
