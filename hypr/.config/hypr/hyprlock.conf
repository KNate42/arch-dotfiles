# hyprlock: lock screen with the current wallpaper and matugen colors
# This work made by Anfinogentov Nikita

# Здесь я подключаю цвета и путь к обоям, которые пишет matugen ($primary, $surface, $wallpaper ...)
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    fail_timeout = 2000
}

background {
    monitor =
    path = $wallpaper
    color = $surface
    blur_passes = 3
    blur_size = 7
}

label {
    monitor =
    text = $TIME
    color = $on_surface
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $on_surface_variant
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 14
    outer_color = $primary
    inner_color = $surface_container
    font_color = $on_surface
    check_color = $tertiary
    fail_color = $error
    fail_text = Ooops.. $FAIL
    placeholder_text = Password
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[EN,RU]
    color = $on_surface_variant
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -100
    halign = center
    valign = center
}
