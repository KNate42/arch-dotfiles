# kitty terminal config
# This work made by Anfinogentov Nikita

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
cursor_trail 3
scrollback_lines 10000

# Здесь я делаю спокойную панель вкладок без powerline-скосов, цвета приходят из colors.conf
tab_bar_edge bottom
tab_bar_style separator
tab_separator "  "
tab_bar_margin_width 8
tab_bar_margin_height 4 4
tab_title_template "  {title}  "
active_tab_font_style bold
inactive_tab_font_style normal

background_opacity 0.88

shell fish

# Здесь я подключаю цвета от matugen; через globinclude, чтобы без файла не было ошибки
globinclude colors.conf
